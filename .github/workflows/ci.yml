name: Learn CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run prebuild && npm run build
      - run: npx wrangler deploy --dry-run --outdir /tmp/learn-worker-check
      - run: node -e "const fs=require('fs'); const w=fs.readFileSync('wrangler.jsonc','utf8'); if(!w.includes('\"workers_dev\": false')) throw Error('workers_dev must be false');"
